name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format & Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust cache
        uses: swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust cache
        uses: swatinem/rust-cache@v2
      - name: build
        run: cargo build --verbose

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust cache
        uses: swatinem/rust-cache@v2
      - name: tests
        run: cargo test